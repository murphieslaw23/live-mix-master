name: Web Mixer Contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-mixer-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mixer-contract:
    name: Mixer Protocol + Controller
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - run: bash tool/bootstrap_fonts.sh
      - run: flutter pub get
      - name: Build canonical DSP Wasm fixture
        run: |
          docker run --rm -v "$PWD:/src" -w /src emscripten/emsdk:6.0.9 bash tool/build_dsp_wasm.sh
          sudo chown -R "$(id -u):$(id -g)" build
      - run: node --test test/web_mixer_worklet_protocol_test.mjs
      - run: flutter test test/browser_mixer_protocol_test.dart test/browser_mixer_controller_test.dart test/browser_audio_processing_controller_test.dart test/web_reference_live_state_test.dart test/web_reference_runtime_sharing_contract_test.dart

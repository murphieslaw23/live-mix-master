name: Shared DSP Wasm Contract

on:
  pull_request:
    paths:
      - 'native/**'
      - 'lib/audio/web/**'
      - 'test/**'
      - 'tool/**'
      - 'web/audio/**'
      - 'web/fingerprint/**'
      - '.github/workflows/shared-dsp-wasm-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-dsp-wasm-contract:
    name: Shared DSP Wasm Contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - run: bash tool/bootstrap_fonts.sh
      - run: flutter pub get
      - name: Verify native DSP ABI v1
        run: |
          mkdir -p build/native-abi
          c++ -std=c++17 -O2 -DLMM_DSP_ABI_TESTING -I native native/tests/dsp_wasm_abi_test.cpp native/dsp_wasm_abi.cpp -o build/native-abi/dsp-wasm-abi
          build/native-abi/dsp-wasm-abi
      - name: Verify expanded native DSP parity vectors
        run: |
          mkdir -p build/native-parity
          c++ -std=c++17 -O2 -I native native/tests/dsp_parity_vectors_test.cpp -o build/native-parity/dsp-parity
          build/native-parity/dsp-parity test/fixtures/dsp_parity_vectors.tsv
      - name: Verify Dart reference parity vectors
        run: flutter test test/web_dsp_kernel_test.dart
      - name: Build canonical DSP Wasm with pinned Emscripten
        run: |
          docker run --rm -v "$PWD:/src" -w /src emscripten/emsdk:6.0.9 bash tool/build_dsp_wasm.sh
          sudo chown -R "$(id -u):$(id -g)" build
      - name: Verify shared DSP Wasm contract
        run: |
          test -s build/dsp-wasm/livemixmaster-dsp.wasm.sha256
          node --test test/web_dsp_wasm_build_contract_test.mjs test/web_dsp_wasm_parity_test.mjs
      - name: Verify DSP startup handshake contract
        run: |
          node --test \
            test/web_audio_graph_integration_test.mjs \
            test/web_audio_worklet_processor_test.mjs \
            test/web_audio_worklet_wasm_transport_contract_test.mjs
          flutter test test/web_dsp_startup_boundary_test.dart
      - name: Verify DSP Wasm render cutover contract
        run: |
          node --test \
            test/web_dsp_worklet_allocation_contract_test.mjs \
            test/web_dsp_partial_quantum_contract_test.mjs \
            test/web_audio_worklet_processor_test.mjs \
            test/web_recorder_pipeline_integration_test.mjs \
            test/web_wav_recorder_worker_test.mjs \
            test/web_fingerprint_worker_test.mjs
      - name: Verify fail-closed Web operator and controller contracts
        run: |
          flutter test \
            test/web_release_compile_boundary_test.dart \
            test/browser_capture_controller_test.dart \
            test/browser_media_gateway_test.dart \
            test/web_dsp_kernel_test.dart \
            test/browser_audio_processing_controller_test.dart \
            test/browser_mixer_controller_test.dart \
            test/browser_recording_controller_test.dart
          node --test \
            test/web_audio_worklet_processor_test.mjs \
            test/web_audio_graph_integration_test.mjs \
            test/web_wav_recorder_worker_test.mjs \
            test/web_recorder_failure_cleanup_test.mjs \
            test/web_recorder_export_test.mjs \
            test/web_recording_operator_gateway_test.mjs \
            test/web_recorder_finalize_test.mjs \
            test/web_recorder_pipeline_integration_test.mjs
      - name: Verify DSP Wasm release provenance contract
        run: node --test test/web_dsp_release_provenance_contract_test.mjs

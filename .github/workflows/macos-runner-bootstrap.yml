name: Issue 2 macOS runner bootstrap

on:
  pull_request:
    paths:
      - '.github/workflows/macos-runner-bootstrap.yml'
      - 'docs/adr/0001-macos-initial-desktop-target.md'
      - 'docs/superpowers/plans/2026-09-09-issue-2-macos-desktop-runner.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-macos-runner:
    name: Generate Flutter 3.47.2 macOS runner
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Show generator version
        run: flutter --version

      - name: Resolve packages and verify native loader contract
        run: |
          bash tool/bootstrap_fonts.sh
          flutter pub get
          flutter test test/native_library_loader_test.dart

      - name: Generate isolated macOS runner
        run: |
          rm -rf /tmp/live_mix_master_runner
          flutter create \
            --platforms=macos \
            --org org.syco23 \
            --project-name live_mix_master \
            --no-pub \
            /tmp/live_mix_master_runner
          rm -rf macos
          cp -R /tmp/live_mix_master_runner/macos macos
          find macos -maxdepth 4 -type f -print | sort

      - name: Upload generated runner
        uses: actions/upload-artifact@v4
        with:
          name: issue2-generated-macos-runner
          path: macos/**
          if-no-files-found: error
          retention-days: 7

      - name: Commit generated runner to PR branch
        if: github.event_name == 'pull_request'
        run: |
          git config user.name 'Murphies Law'
          git config user.email 'emilach82@gmail.com'
          git add macos
          if git diff --cached --quiet; then
            echo 'Generated runner already matches the branch.'
            exit 0
          fi
          git commit -m 'build(macos): commit Flutter 3.47.2 runner'
          git push origin "HEAD:${{ github.head_ref }}"

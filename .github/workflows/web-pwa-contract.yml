name: Web PWA Contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pwa-offline-accessibility:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: PWA Offline Accessibility Contract
    runs-on: [self-hosted, Linux, X64, syco23, broker]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify PWA offline/accessibility source contract
        run: node --test test/web_pwa_offline_accessibility_contract_test.mjs

name: Web PWA Contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pwa-offline-accessibility:
    name: PWA Offline Accessibility Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify PWA offline/accessibility source contract
        run: node --test test/web_pwa_offline_accessibility_contract_test.mjs

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter-analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - run: bash tool/bootstrap_fonts.sh
      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos

  design-contract-test:
    name: Design Contract Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - run: bash tool/bootstrap_fonts.sh
      - run: flutter pub get
      - run: flutter test test/design_contract_test.dart test/operator_journey_test.dart test/design_system_semantics_test.dart test/operator_surface_design_contract_test.dart test/component_state_registry_test.dart test/responsive_layout_test.dart test/approved_visual_parity_contract_test.dart

  golden-fixture-render:
    name: Golden Fixture Render (review artifact)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - run: bash tool/bootstrap_fonts.sh
      - run: flutter pub get
      - name: Render deterministic review fixtures
        run: flutter test --update-goldens test/golden_fixture_render_test.dart
      - name: Upload Issue #5 golden fixtures
        uses: actions/upload-artifact@v4
        with:
          name: issue5-golden-fixtures
          path: test/goldens/*.png
          if-no-files-found: error
          retention-days: 14

  reliability-models-test:
    name: Reliability Models Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - run: bash tool/bootstrap_fonts.sh
      - run: flutter pub get
      - run: flutter test test/reliability_models_test.dart test/session_tracklist_test.dart test/fingerprint_tracklist_bridge_test.dart test/session_tracklist_codec_test.dart test/session_tracklist_store_test.dart test/session_tracklist_persister_test.dart test/live_session_tracklist_controller_test.dart test/fingerprint_service_test.dart test/tracklist_exporter_test.dart

  broadcast-pipeline-test:
    name: Broadcast Pipeline Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - run: bash tool/bootstrap_fonts.sh
      - run: flutter pub get
      - run: flutter test --reporter expanded test/broadcast_pipeline_test.dart test/broadcast_metadata_adapter_test.dart

  mixer-user-flow-test:
    name: Mixer User Flow Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - run: bash tool/bootstrap_fonts.sh
      - run: flutter pub get
      - run: flutter test test/mixer_user_flow_test.dart

  native-engine-build:
    name: Native Engine Build (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/native --config Release --parallel

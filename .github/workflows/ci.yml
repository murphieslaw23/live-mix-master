name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter-analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - run: bash tool/bootstrap_fonts.sh
      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos

  design-contract-test:
    name: Design Contract Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - run: bash tool/bootstrap_fonts.sh
      - run: flutter pub get
      - run: flutter test test/design_contract_test.dart test/operator_journey_test.dart test/design_system_semantics_test.dart test/operator_surface_design_contract_test.dart test/component_state_registry_test.dart test/responsive_layout_test.dart test/approved_visual_parity_contract_test.dart

  golden-fixture-contract:
    name: Golden Fixture Contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - run: bash tool/bootstrap_fonts.sh
      - run: flutter pub get
      - name: Render deterministic approved fixtures
        run: flutter test --update-goldens test/golden_fixture_render_test.dart
      - name: Verify approved pixel digests
        run: grep -v '^#' test/goldens/issue5-approved-sha256.txt | sha256sum --check -
      - name: Upload Issue #5 golden fixtures
        uses: actions/upload-artifact@v4
        with:
          name: issue5-golden-fixtures
          path: test/goldens/*.png
          if-no-files-found: error
          retention-days: 14

  reliability-models-test:
    name: Reliability Models Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - run: bash tool/bootstrap_fonts.sh
      - run: flutter pub get
      - run: flutter test test/reliability_models_test.dart test/session_tracklist_test.dart test/fingerprint_tracklist_bridge_test.dart test/session_tracklist_codec_test.dart test/session_tracklist_store_test.dart test/session_tracklist_persister_test.dart test/live_session_tracklist_controller_test.dart test/fingerprint_service_test.dart test/tracklist_exporter_test.dart

  broadcast-pipeline-test:
    name: Broadcast Pipeline Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - run: bash tool/bootstrap_fonts.sh
      - run: flutter pub get
      - run: flutter test --reporter expanded test/broadcast_pipeline_test.dart test/broadcast_metadata_adapter_test.dart

  mixer-user-flow-test:
    name: Mixer User Flow Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - run: bash tool/bootstrap_fonts.sh
      - run: flutter pub get
      - run: flutter test test/mixer_user_flow_test.dart

  web-release-compile:
    name: Web Release Compile Contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - run: bash tool/bootstrap_fonts.sh
      - run: flutter pub get
      - name: Verify native DSP parity vectors
        run: |
          mkdir -p build/native-parity
          c++ -std=c++17 -O2 -I native native/tests/dsp_parity_vectors_test.cpp -o build/native-parity/dsp-parity
          build/native-parity/dsp-parity test/fixtures/dsp_parity_vectors.tsv
      - name: Verify AudioWorklet processor contract
        run: node --test test/web_audio_worklet_processor_test.mjs
      - name: Verify Web Audio graph integration contract
        run: node --test test/web_audio_graph_integration_test.mjs
      - name: Verify >=10s Web WAV worker contract
        run: node --test test/web_wav_recorder_worker_test.mjs
      - name: Verify recorder failure cleanup contract
        run: node --test test/web_recorder_failure_cleanup_test.mjs
      - name: Verify finalized recording export contract
        run: node --test test/web_recorder_export_test.mjs
      - name: Verify operator-controlled recording gateway
        run: node --test test/web_recording_operator_gateway_test.mjs
      - name: Verify graceful recorder finalization contract
        run: node --test test/web_recorder_finalize_test.mjs
      - name: Verify Worklet-to-Worker recorder pipeline contract
        run: node --test test/web_recorder_pipeline_integration_test.mjs
      - name: Prepare official fpcalc 1.6.1 reference
        run: |
          mkdir -p build/fpcalc-reference
          curl -fsSL https://github.com/acoustid/chromaprint/releases/download/v1.6.1/chromaprint-fpcalc-1.6.1-linux-x86_64.tar.gz -o build/fpcalc-reference/fpcalc.tar.gz
          echo 'fc16cd37a70168040bc9ceb45f1d4d1216f5a75bc4c9cf8564bea70ac6a45733  build/fpcalc-reference/fpcalc.tar.gz' | sha256sum --check -
          tar -xzf build/fpcalc-reference/fpcalc.tar.gz -C build/fpcalc-reference
          FPCALC_BIN="$(find build/fpcalc-reference -type f -name fpcalc | head -1)"
          test -n "$FPCALC_BIN"
          chmod +x "$FPCALC_BIN"
          echo "FPCALC_BIN=$FPCALC_BIN" >> "$GITHUB_ENV"
      - name: Build official Chromaprint 1.6.1 Wasm
        run: docker run --rm -v "$PWD:/src" -w /src emscripten/emsdk:6.0.9 bash tool/build_chromaprint_wasm.sh
      - name: Verify official Chromaprint Wasm parity
        run: node --test test/web_chromaprint_wasm_parity_test.mjs
      - name: Verify server-side fingerprint provider proxy contract
        run: node --test test/web_fingerprint_proxy_test.mjs
      - name: Verify server-side broadcast metadata proxy contract
        run: node --test test/web_broadcast_metadata_proxy_test.mjs
      - name: Verify Flutter fingerprint proxy client contract
        run: flutter test test/web_fingerprint_proxy_client_test.dart
      - name: Verify fingerprint operator state contract
        run: flutter test test/browser_fingerprint_lookup_controller_test.dart
      - name: Verify web platform, capture, DSP, and recording state contracts
        run: flutter test test/web_release_compile_boundary_test.dart test/browser_capture_controller_test.dart test/browser_media_gateway_test.dart test/web_dsp_kernel_test.dart test/browser_audio_processing_controller_test.dart test/browser_recording_controller_test.dart
      - name: Build Flutter Web release artifact
        run: flutter build web --release
      - name: Upload Flutter Web artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: live-mix-master-web
          path: build/web
          if-no-files-found: error
          retention-days: 14

  native-engine-build:
    name: Native Engine Build (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/native --config Release --parallel

name: Release Governance Contract

on:
  pull_request:
    paths:
      - '.github/workflows/promote-tested-web-artifact.yml'
      - '.github/workflows/release-governance-contract.yml'
      - 'test/ci_release_provenance_contract_test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-governance-contract:
    name: Release Governance Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify production promotion provenance contract
        run: node --test test/ci_release_provenance_contract_test.mjs

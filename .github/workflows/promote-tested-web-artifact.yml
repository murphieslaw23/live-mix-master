name: Promote tested Web artifact

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: GitHub Actions live-mix-master-web artifact ID
        required: true
        type: string
      artifact_digest:
        description: Artifact SHA-256 digest in sha256:<hex> form
        required: true
        type: string
      commit_sha:
        description: Exact commit SHA that produced the artifact
        required: true
        type: string
      target:
        description: Deployment target
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  actions: read
  contents: read

concurrency:
  group: live-mix-master-web-promotion-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote verified artifact
    runs-on: ubuntu-latest
    environment: ${{ inputs.target == 'production' && 'vercel-production' || 'vercel-preview' }}
    env:
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
      COMMIT_SHA: ${{ inputs.commit_sha }}
      TARGET: ${{ inputs.target }}
      VERCEL_ORG_ID: team_NgD523QOHDHfux9i6bXTZTUr
      VERCEL_PROJECT_ID: prj_DeQFFyYAUHEotogFlolPXAs62uqH
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Validate immutable release inputs
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error title=Invalid artifact ID::artifact_id must contain decimal digits only"
            exit 1
          fi
          if ! [[ "$ARTIFACT_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error title=Invalid artifact digest::artifact_digest must be sha256: followed by 64 lowercase hex characters"
            exit 1
          fi
          if ! [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid commit SHA::commit_sha must be a 40-character lowercase Git SHA"
            exit 1
          fi
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo "::error title=Missing Vercel token::VERCEL_TOKEN did not resolve in this GitHub environment"
            exit 1
          fi
          echo "Immutable release inputs and scoped Vercel token are present."

      - name: Check out the exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Verify checked-out source identity
        run: |
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
          test -f vercel.json
          test -d api

      - name: Verify artifact provenance and download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location --retry 3 --header "Accept: application/vnd.github+json" --header "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --output artifact-metadata.json
          test "$(jq -r '.name' artifact-metadata.json)" = live-mix-master-web
          test "$(jq -r '.expired' artifact-metadata.json)" = false
          test "$(jq -r '.workflow_run.head_sha' artifact-metadata.json)" = "$COMMIT_SHA"
          test "$(jq -r '.digest' artifact-metadata.json)" = "$ARTIFACT_DIGEST"
          curl --fail --location --retry 3 --header "Accept: application/vnd.github+json" --header "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" --output web-artifact.zip
          printf '%s  %s\n' "${ARTIFACT_DIGEST#sha256:}" web-artifact.zip | sha256sum --check -

      - name: Assemble deployable exact-artifact payload
        run: |
          rm -rf extracted release-payload
          mkdir -p extracted release-payload/build/web release-payload/.vercel
          unzip -q web-artifact.zip -d extracted
          WEB_INDEX="$(find extracted -type f -name index.html -print -quit)"
          test -n "$WEB_INDEX"
          WEB_ROOT="$(dirname "$WEB_INDEX")"
          cp -a "$WEB_ROOT"/. release-payload/build/web/
          test -f release-payload/build/web/index.html
          cp -a api release-payload/api
          cp vercel.json release-payload/vercel.json
          cat > release-payload/.vercel/project.json <<EOF
          {"orgId":"$VERCEL_ORG_ID","projectId":"$VERCEL_PROJECT_ID"}
          EOF

      - name: Deploy without rebuilding the Flutter artifact
        id: deploy
        working-directory: release-payload
        run: |
          set -euo pipefail
          if [ "$TARGET" = production ]; then
            DEPLOY_URL="$(npx --yes vercel@48.2.8 deploy --prod --yes --token "$VERCEL_TOKEN")"
          else
            DEPLOY_URL="$(npx --yes vercel@48.2.8 deploy --yes --token "$VERCEL_TOKEN")"
          fi
          DEPLOY_HOST="${DEPLOY_URL#https://}"
          DEPLOY_HOST="${DEPLOY_HOST%/}"
          DEPLOY_JSON="$(curl --fail --silent --show-error --location --retry 3 \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$DEPLOY_HOST?teamId=$VERCEL_ORG_ID")"
          DEPLOY_ID="$(printf '%s' "$DEPLOY_JSON" | jq -r '.id')"
          if ! [[ "$DEPLOY_ID" =~ ^dpl_[A-Za-z0-9]+$ ]]; then
            echo "::error title=Invalid Vercel deployment ID::Could not resolve deployment ID for $DEPLOY_HOST"
            exit 1
          fi
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"

      - name: Verify protected release shell and server-route presence
        working-directory: release-payload
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          DEPLOY_ID: ${{ steps.deploy.outputs.id }}
        run: |
          set -euo pipefail
          vercel_curl() {
            npx --yes vercel@48.8.0 curl "$1" --deployment "$DEPLOY_ID" --token "$VERCEL_TOKEN"
          }
          vercel_post_probe() {
            npx --yes vercel@48.8.0 curl "$1" --deployment "$DEPLOY_ID" --token "$VERCEL_TOKEN" -- \
              --request POST \
              --header "Content-Type: application/json" \
              --data '{}'
          }
          assert_safe_probe() {
            printf '%s' "$1" | jq -e \
              '.ok == false and (.failureCode == "invalidRequest" or .failureCode == "invalidConfiguration")' \
              >/dev/null
          }
          vercel_curl / >/dev/null
          FINGERPRINT_BODY="$(vercel_post_probe /api/fingerprint-lookup)"
          BROADCAST_BODY="$(vercel_post_probe /api/broadcast-metadata)"
          assert_safe_probe "$FINGERPRINT_BODY"
          assert_safe_probe "$BROADCAST_BODY"

      - name: Record non-secret promotion evidence
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          DEPLOY_ID: ${{ steps.deploy.outputs.id }}
        run: |
          set -euo pipefail
          {
            printf '%s\n' '## LiveMixMaster Web artifact promotion'
            printf '\n'
            printf -- '- Target: `%s`\n' "$TARGET"
            printf -- '- Commit: `%s`\n' "$COMMIT_SHA"
            printf -- '- Artifact ID: `%s`\n' "$ARTIFACT_ID"
            printf -- '- Artifact digest: `%s`\n' "$ARTIFACT_DIGEST"
            printf -- '- Deployment ID: `%s`\n' "$DEPLOY_ID"
            printf -- '- Deployment URL: %s\n' "$DEPLOY_URL"
            printf '%s\n' '- Shell: passed'
            printf '%s\n' '- Fingerprint route: authenticated POST reached safe validation/configuration handling; no provider request made'
            printf '%s\n' '- Broadcast route: authenticated POST reached safe validation/configuration handling; no destination request made'
          } >> "$GITHUB_STEP_SUMMARY"
